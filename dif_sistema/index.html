<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Interno DIF - Login</title>

    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* ESTILOS DE EMERGENCIA - Esto hará que se centre de inmediato */
        :root {
            --color-principal: #8B0000;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ocupa todo el alto de la pantalla */
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .logo-dif {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            /* Si el logo no aparece, revisa que el archivo se llame logodif.png */
        }

        .titulo-login {
            color: var(--color-principal);
            margin-bottom: 5px;
            font-size: 1.6em;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.9em;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Evita que el input se salga de la caja */
        }

        .btn-entrar {
            width: 100%;
            background-color: var(--color-principal);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }

        .btn-entrar:hover {
            background-color: #630000;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logodiff.png" alt="Logo DIF" class="logo-dif">
        
        <h2 class="titulo-login">Sistema Interno DIF</h2>
        <p style="color: #666; font-size: 0.9em; margin-bottom: 25px;">Ingresa tus credenciales</p>

        <form action="validar_login.php" method="POST">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" name="usuario" placeholder="Tu usuario" required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" name="contrasena" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" name="entrar" class="btn-entrar">ENTRAR</button>
        </form>

        <p class="footer">© Cadereyta de Montes, Querétaro</p>
    </div>

    <script>
        // Si el login falla, avisamos al usuario
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            alert("Usuario o contraseña incorrectos.");
        }
    </script>

</body>
</html>
